<title>QuickFab</title>
<script>
  // phones and tablets get the installable app, computers get the web version
  var touch = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
  location.replace(touch ? 'mobile/' : 'web/');
</script>

</head>

</html>
